plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    sourceSets.main.java.srcDir '../../android/src'
    namespace 'rs.trecker'
    compileSdk 34
    defaultConfig {
        applicationId 'rs.trecker'
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName '2.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
